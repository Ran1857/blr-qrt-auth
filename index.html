<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLR QRT Dashboard — Auth</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;display:flex;align-items:center;
       justify-content:center;height:100vh;margin:0;background:#f5f7fa}
  .box{text-align:center;max-width:420px;padding:32px;background:#fff;
       border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.10)}
  h2{font-size:16px;color:#1D2329;margin:0 0 8px}
  p{font-size:13px;color:#6E7880;margin:0 0 20px;line-height:1.6}
  button{background:#0070F2;color:#fff;border:none;padding:9px 22px;
         border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
  button:hover{background:#005BB5}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid #E1E2E6;
        border-top-color:#0070F2;border-radius:50%;animation:spin .7s linear infinite;
        vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <h2 id="titleEl">Completing sign-in&hellip;</h2>
  <p id="msgEl"><span class="spin"></span>Please wait &mdash; this tab will close automatically.</p>
  <button id="closeBtn" style="display:none" onclick="window.close()">Close this tab</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
(function(){
  var titleEl  = document.getElementById('titleEl');
  var msgEl    = document.getElementById('msgEl');
  var closeBtn = document.getElementById('closeBtn');

  function done(ok, msg){
    titleEl.textContent = ok ? 'Sign-in complete' : 'Nothing to do here';
    msgEl.innerHTML = msg || (ok
      ? 'Authentication successful. This tab will close automatically.'
      : 'This page is part of the BLR QRT Dashboard sign-in flow.<br>It should only be opened by the dashboard. You can close this tab safely.');
    closeBtn.style.display = 'inline-block';
    setTimeout(function(){ try{ window.close(); }catch(e){} }, 2000);
  }

  /* MSAL instance — must match dashboard config exactly */
  var cfg = {
    auth: {
      clientId:    'b0e1ba73-7ff2-4c9f-91c4-eb2bf78adfe2',
      authority:   'https://login.microsoftonline.com/42f7676c-f455-423c-82f6-dc2d99791af7',
      redirectUri: 'https://ran1857.github.io/blr-qrt-auth/'
    },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true }
  };

  try{
    var msalInst = new msal.PublicClientApplication(cfg);
    /* handleRedirectPromise processes the auth code and posts result to opener */
    msalInst.handleRedirectPromise()
      .then(function(result){
        done(true);
      })
      .catch(function(err){
        console.error('[auth-redirect]', err);
        done(false, 'Sign-in error &mdash; please close this tab and try again.');
      });
  }catch(e){
    console.error('[auth-redirect] init', e);
    done(false);
  }

  /* Safety timeout — never hang longer than 10 s */
  setTimeout(function(){
    done(false, 'Sign-in timed out. Please close this tab and try again.');
  }, 10000);
})();
</script>
</body>
</html>
